name: Jekyll build

on:
  push:
    branches: [master]
  workflow_dispatch:
  # Run after bad-pr check
  workflow_run:
    workflows: ["Cleanup bad PR"]
    branches: [main]
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: jekyll-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "GitHub Pages is already configured."
          else
            gh api --method POST "repos/${{ github.repository }}/pages" \
              -f "source[branch]=master" \
              -f "source[path]=/"
          fi